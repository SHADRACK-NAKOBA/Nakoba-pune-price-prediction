name: CI/CD — Lint · Test · Build · Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # manual trigger — used for the deploy job

jobs:

  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff black

      - name: ruff — style + error checks
        run: ruff check src/ tests/ mlops/

      - name: black — format check (no reformatting, just fails if needed)
        run: black --check src/ tests/ mlops/

  # ── Job 2: Test ──────────────────────────────────────────────────────────────
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Pre-download NLTK corpora
        run: |
          python -c "
          import nltk
          for pkg in ('punkt', 'punkt_tab', 'averaged_perceptron_tagger',
                      'averaged_perceptron_tagger_eng', 'stopwords'):
              nltk.download(pkg, quiet=True)
          "

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  # ── Job 3: Docker Build + Smoke Test ─────────────────────────────────────────
  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull model artifacts via DVC (skipped when secrets absent)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER:  ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO:  ${{ secrets.DAGSHUB_REPO }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            pip install "dvc[s3]" dagshub --quiet
            dvc remote modify origin --local auth basic
            dvc remote modify origin --local user  "$DAGSHUB_USER"
            dvc remote modify origin --local password "$DAGSHUB_TOKEN"
            dvc pull model/ --force || echo "DVC pull failed — model stubs used"
          else
            echo "DAGSHUB_TOKEN not set — skipping dvc pull"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t pune-price-prediction:ci-${{ github.sha }} .

      - name: Smoke test — start container and hit /health
        run: |
          docker run -d --name api-smoke \
            -e PORT=8000 \
            -p 8000:8000 \
            pune-price-prediction:ci-${{ github.sha }}
          echo "Waiting 45 s for container cold start..."
          sleep 45
          curl --retry 5 --retry-delay 5 --retry-connrefused \
               --fail http://localhost:8000/health
          docker stop api-smoke
          echo "Smoke test passed"

  # ── Job 4: Deploy to AWS ECR + ECS ───────────────────────────────────────────
  # Triggered MANUALLY via "Run workflow" button in GitHub Actions UI.
  # Requires these GitHub Secrets to be set (Settings → Secrets → Actions):
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
  #   AWS_ACCOUNT_ID, ECR_REPO_NAME
  # Optional (for ECS auto-update):
  #   ECS_CLUSTER_NAME, ECS_SERVICE_NAME
  deploy:
    name: Deploy → ECR + ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull model artifacts via DVC
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER:  ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO:  ${{ secrets.DAGSHUB_REPO }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            pip install "dvc[s3]" dagshub --quiet
            dvc remote modify origin --local auth basic
            dvc remote modify origin --local user  "$DAGSHUB_USER"
            dvc remote modify origin --local password "$DAGSHUB_TOKEN"
            dvc pull model/ --force
          fi

      - name: Build, tag, and push image to ECR
        id: push-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_NAME }}
          IMAGE_TAG:       ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment (if ECS_CLUSTER_NAME secret is set)
        if: ${{ env.ECS_CLUSTER_NAME != '' }}
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
        run: |
          aws ecs update-service \
            --cluster  $ECS_CLUSTER_NAME \
            --service  $ECS_SERVICE_NAME \
            --force-new-deployment \
            --region   ${{ secrets.AWS_REGION }}
          echo "ECS rolling deployment triggered for $ECS_SERVICE_NAME"

      - name: Print deployment summary
        run: |
          echo "============================================="
          echo "DEPLOYMENT COMPLETE"
          echo "============================================="
          echo "Image: ${{ steps.push-image.outputs.image }}"
          echo "Latest: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:latest"
          echo ""
          echo "Next: check App Runner / ECS console for live URL"
          echo "App Runner auto-deploys when ECR:latest is updated."
