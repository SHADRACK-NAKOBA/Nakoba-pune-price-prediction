name: CI — Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Unit Tests ────────────────────────────────────────────────────────
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Pre-download NLTK corpora
        run: |
          python -c "
          import nltk
          for pkg in ('punkt', 'punkt_tab', 'averaged_perceptron_tagger',
                      'averaged_perceptron_tagger_eng', 'stopwords'):
              nltk.download(pkg, quiet=True)
          "

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  # ── Job 2: Docker Build (smoke test) ────────────────────────────────────────
  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: test
    # Only on pushes to main — PRs from forks won't have DVC secrets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull model artifacts via DVC (skipped if secrets absent)
        if: ${{ env.DAGSHUB_TOKEN != '' }}
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER:  ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO:  ${{ secrets.DAGSHUB_REPO }}
        run: |
          pip install "dvc[s3]" dagshub --quiet
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user  "$DAGSHUB_USER"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull model/ --force || echo "DVC pull failed — skipping"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — just validates the Dockerfile)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pune-price-prediction:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
