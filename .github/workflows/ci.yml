name: CI/CD — Lint · Test · Build · Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:           # manual trigger — used for the deploy job

jobs:

  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff black

      - name: ruff — style + error checks
        run: ruff check src/ tests/ mlops/

      - name: black — format check (no reformatting, just fails if needed)
        run: black --check src/ tests/ mlops/

  # ── Job 2: Test ──────────────────────────────────────────────────────────────
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Pre-download NLTK corpora
        run: |
          python -c "
          import nltk
          for pkg in ('punkt', 'punkt_tab', 'averaged_perceptron_tagger',
                      'averaged_perceptron_tagger_eng', 'stopwords'):
              nltk.download(pkg, quiet=True)
          "

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  # ── Job 3: Docker Build + Smoke Test ─────────────────────────────────────────
  docker-build:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull model artifacts via DVC (create stubs if secrets absent)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER:  ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO:  ${{ secrets.DAGSHUB_REPO }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            pip install dvc dagshub --quiet
            cat > .dvc/config << EOF
[core]
    remote = origin
['remote "origin"']
    url = https://dagshub.com/${DAGSHUB_USER}/${DAGSHUB_REPO}.dvc
    auth = basic
    user = ${DAGSHUB_USER}
    password = ${DAGSHUB_TOKEN}
EOF
            dvc pull model/ --force || echo "DVC pull failed — creating stubs"
          fi
          # Create stub model artifacts if real ones are not present.
          # The stubs are valid sklearn/pickle objects so the container starts
          # and /health responds — sufficient for the CI smoke test.
          if [ ! -f model/property_price_prediction_voting.sav ]; then
            pip install scikit-learn joblib --quiet
            python scripts/create_model_stubs.py
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t pune-price-prediction:ci-${{ github.sha }} .

      - name: Smoke test — start container and hit /health
        run: |
          docker run -d --name api-smoke \
            -e PORT=8000 \
            -p 8000:8000 \
            pune-price-prediction:ci-${{ github.sha }}
          echo "Waiting 45 s for container cold start..."
          sleep 45
          curl --retry 5 --retry-delay 5 --retry-connrefused \
               --fail http://localhost:8000/health
          docker stop api-smoke
          echo "Smoke test passed"

  # ── Job 4: Deploy to AWS ECR + ECS ───────────────────────────────────────────
  # Triggered MANUALLY via "Run workflow" button in GitHub Actions UI.
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   AWS_ACCESS_KEY_ID       — IAM user access key
  #   AWS_SECRET_ACCESS_KEY   — IAM user secret key
  #   AWS_REGION              — e.g. us-east-1
  #   ECR_REPO_NAME           — e.g. pune-price-prediction
  #   ECS_CLUSTER_NAME        — e.g. pune-mlops
  #   ECS_SERVICE_NAME        — e.g. pune-price-prediction
  #
  # Optional (enables real model files via DVC):
  #   DAGSHUB_TOKEN, DAGSHUB_USER, DAGSHUB_REPO
  deploy:
    name: Deploy → ECR + ECS
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull model artifacts via DVC (create stubs if secrets absent)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER:  ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO:  ${{ secrets.DAGSHUB_REPO }}
        run: |
          if [ -n "$DAGSHUB_TOKEN" ]; then
            echo "Pulling real model artifacts from DagsHub..."
            pip install dvc dagshub --quiet
            cat > .dvc/config << EOF
[core]
    remote = origin
['remote "origin"']
    url = https://dagshub.com/${DAGSHUB_USER}/${DAGSHUB_REPO}.dvc
    auth = basic
    user = ${DAGSHUB_USER}
    password = ${DAGSHUB_TOKEN}
EOF
            dvc pull model/ --force
          fi
          if [ ! -f model/property_price_prediction_voting.sav ]; then
            echo "No real model files found — creating stubs for deploy..."
            pip install scikit-learn joblib --quiet
            python scripts/create_model_stubs.py
          else
            echo "Real model artifacts ready."
          fi

      - name: Build, tag, and push image to ECR
        id: push-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO_NAME }}
          IMAGE_TAG:       ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service ${{ secrets.ECS_SERVICE_NAME }} \
            --force-new-deployment \
            --region  ${{ secrets.AWS_REGION }}
          echo "ECS rolling deployment triggered for ${{ secrets.ECS_SERVICE_NAME }}"

      - name: Wait for ECS service to stabilise
        run: |
          echo "Waiting for ECS service to reach steady state (up to 5 min)..."
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --services ${{ secrets.ECS_SERVICE_NAME }} \
            --region  ${{ secrets.AWS_REGION }}
          echo "Service is stable."

      - name: Get live public IP and print summary
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --service-name ${{ secrets.ECS_SERVICE_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --desired-status RUNNING \
            --query "taskArns[0]" --output text)

          ENI=$(aws ecs describe-tasks \
            --cluster ${{ secrets.ECS_CLUSTER_NAME }} \
            --tasks $TASK_ARN \
            --region ${{ secrets.AWS_REGION }} \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
            --output text)

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI \
            --query "NetworkInterfaces[0].Association.PublicIp" \
            --output text --region ${{ secrets.AWS_REGION }})

          echo "============================================="
          echo "DEPLOYMENT COMPLETE"
          echo "============================================="
          echo "Image : ${{ steps.push-image.outputs.image }}"
          echo "Latest: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:latest"
          echo ""
          echo "Live endpoints:"
          echo "  Health : http://$PUBLIC_IP:8000/health"
          echo "  Swagger: http://$PUBLIC_IP:8000/docs"
          echo "  Predict: http://$PUBLIC_IP:8000/predict"
          echo "============================================="
