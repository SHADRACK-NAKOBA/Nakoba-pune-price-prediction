# Nginx reverse proxy for the Pune Price Prediction API.
#
# Sits in front of the FastAPI container to handle:
#   • Security headers
#   • Rate limiting (10 req/s per IP, burst 20)
#   • Health check pass-through (bypasses rate limit for ALB probes)
#   • Proxy timeouts tuned for ML inference latency
#
# Usage with docker compose:
#   docker compose --profile proxy up
#
# Usage standalone (from project root):
#   docker run -p 80:80 \
#     -v "$(pwd)/infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     nginx:alpine

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    gzip on;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 10 requests/s per IP; burst of 20 processed without delay.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Upstream: FastAPI container ───────────────────────────────────────────
    upstream fastapi_app {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Max request body (generous for long property descriptions)
        client_max_body_size 1m;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "DENY"          always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "no-referrer"   always;

        # ── Health check — bypass rate limit for load-balancer probes ─────────
        location = /health {
            proxy_pass       http://fastapi_app;
            proxy_set_header Host $host;
            access_log       off;
        }

        # ── API & docs ────────────────────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # ML inference should complete well within 30 s
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
