version: "3.9"

services:

  # ── FastAPI prediction API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pune-price-prediction:local
    container_name: pune-price-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Nginx reverse proxy (optional — start with: docker compose --profile proxy up) ──
  nginx:
    image: nginx:alpine
    container_name: pune-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    profiles:
      - proxy
    restart: unless-stopped

  # ── MLflow tracking server (optional — start with: docker compose --profile mlops up) ──
  mlflow:
    image: python:3.11-slim
    container_name: pune-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:////mlflow/mlflow.db
    command: >
      sh -c "pip install mlflow --quiet &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts"
    profiles:
      - mlops
    restart: unless-stopped

volumes:
  mlflow-data:
